services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checkstock
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkstock_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:${POSTGRES_PASSWORD:-checkstock_local_only}@db:5432/checkstock
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
